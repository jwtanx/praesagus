# Local safety budgets, NOT verified Moomoo quotas or market-data entitlements.
# Credentials are loaded only through the existing secure locator interface;
# never place keys, tokens, passphrases or private paths in this file.
[provider]
max_requests = 128
max_pages = 16
max_rows = 100000
screen_limit = 300
history_num = 370
history_window_days = 180
timeout_seconds = 10.0
autype = 1

[collection]
state_parent = "~/Documents/stock-research-data"
credential_locator_file = "" # Or PRSG_MOOMOO_CREDENTIAL_LOCATOR; private0600 locator reference, outsideGit.
metadata_file = "" # Optional reviewed sector/issuer/field-currency JSON; unknown is explicit.
calendar = "XNYS"
history_years = 3
revision_sessions = 5
discovery_pages = 1
max_candidates = 900
metadata_enabled = false # Raw provider enrichment optional; never fabricates a reviewed crosswalk.
