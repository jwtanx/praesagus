<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500">
<defs><style>
.bg{fill:#f7f9fc}.title{font:700 42px Arial;fill:#102a43}.sub{font:22px Arial;fill:#486581}.h{font:700 25px Arial;fill:#fff}.t{font:20px Arial;fill:#102a43}.s{font:17px Arial;fill:#486581}.box{stroke:#829ab1;stroke-width:3;rx:18}.blue{fill:#d9eaf7}.green{fill:#d8f3dc}.gold{fill:#fff3bf}.purple{fill:#eadcff}.gray{fill:#e8eef4}.red{fill:#ffe0e0}.line{stroke:#52606d;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#829ab1;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#arrow)}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#52606d"/></marker></defs>
<rect class="bg" width="2400" height="1500"/><text class="title" x="90" y="75">Praesagus Market Intelligence Platform</text><text class="sub" x="92" y="112">Event-driven ingestion, SEC QR intelligence, feature serving, and dashboard delivery</text>
<rect x="70" y="150" width="2260" height="205" class="box blue"/><text class="h" x="100" y="190" fill="#102a43">External sources</text>
<g class="t"><rect x="110" y="220" width="260" height="90" class="box gray"/><text x="135" y="255">SEC EDGAR</text><text class="s" x="135" y="283">Atom, current, XBRL</text><rect x="410" y="220" width="260" height="90" class="box gray"/><text x="435" y="255">Social platforms</text><text class="s" x="435" y="283">Reddit, X, HN, GitHub</text><rect x="710" y="220" width="260" height="90" class="box gray"/><text x="735" y="255">News &amp; trends</text><text class="s" x="735" y="283">RSS, YouTube, Google Trends</text><rect x="1010" y="220" width="260" height="90" class="box gray"/><text x="1035" y="255">Market calendars</text><text class="s" x="1035" y="283">Earnings, macro events</text><rect x="1310" y="220" width="260" height="90" class="box gray"/><text x="1335" y="255">Insider filings</text><text class="s" x="1335" y="283">SEC Form 4</text><rect x="1610" y="220" width="260" height="90" class="box gray"/><text x="1635" y="255">SerpApi</text><text class="s" x="1635" y="283">Optional summary fallback</text></g>
<rect x="70" y="410" width="2260" height="300" class="box green"/><text class="h" x="100" y="450" fill="#102a43">Ingestion and orchestration</text>
<rect x="110" y="480" width="350" height="180" class="box gold"/><text class="t" x="135" y="520">Watchlist + connector config</text><text class="s" x="135" y="552">financial_watchlist.yaml</text><text class="s" x="135" y="580">platform_connectors.yaml</text><text class="s" x="135" y="608">financial_filters.yaml</text>
<rect x="520" y="480" width="350" height="180" class="box gold"/><text class="t" x="545" y="520">Connector framework</text><text class="s" x="545" y="552">multi_runner</text><text class="s" x="545" y="580">registry + base contracts</text><text class="s" x="545" y="608">retry / normalization</text>
<rect x="930" y="480" width="350" height="180" class="box gold"/><text class="t" x="955" y="520">Scheduled execution</text><text class="s" x="955" y="552">Airflow DAGs</text><text class="s" x="955" y="580">ECS runner / Fargate path</text><text class="s" x="955" y="608">local Docker worker</text>
<rect x="1340" y="480" width="350" height="180" class="box gold"/><text class="t" x="1365" y="520">Financial monitors</text><text class="s" x="1365" y="552">SEC QR report + watcher</text><text class="s" x="1365" y="580">Form 4 insider monitor</text><text class="s" x="1365" y="608">company news polling</text>
<rect x="1750" y="480" width="490" height="180" class="box gold"/><text class="t" x="1775" y="520">Signal and document logic</text><text class="s" x="1775" y="552">XBRL metrics + deltas</text><text class="s" x="1775" y="580">buy / short / watch heuristics</text><text class="s" x="1775" y="608">provenance: URL, timestamp, connector</text>
<rect x="70" y="765" width="2260" height="320" class="box purple"/><text class="h" x="100" y="805" fill="#102a43">Storage, transformation, and serving</text>
<rect x="110" y="840" width="390" height="185" class="box gray"/><text class="t" x="135" y="880">LocalStack / AWS data lake</text><text class="s" x="135" y="912">S3 Raw: replay + lineage</text><text class="s" x="135" y="940">S3 Bronze: normalized parquet</text><text class="s" x="135" y="968">S3 Silver: enriched datasets</text>
<rect x="590" y="840" width="390" height="185" class="box gray"/><text class="t" x="615" y="880">Feature computation</text><text class="s" x="615" y="912">raw_to_bronze.py</text><text class="s" x="615" y="940">compute_features.py</text><text class="s" x="615" y="968">quality + trend aggregation</text>
<rect x="1070" y="840" width="390" height="185" class="box gray"/><text class="t" x="1095" y="880">DynamoDB feature store</text><text class="s" x="1095" y="912">low-latency signal lookup</text><text class="s" x="1095" y="940">dashboard summaries</text><text class="s" x="1095" y="968">watchlist history</text>
<rect x="1550" y="840" width="690" height="185" class="box blue"/><text class="t" x="1575" y="880">Backend API: FastAPI / Uvicorn</text><text class="s" x="1575" y="912">/trends  /dashboard  /platforms  /pipelines</text><text class="s" x="1575" y="940">/research  /financial  /settings</text><text class="s" x="1575" y="968">services.py + financial_services.py</text>
<rect x="70" y="1140" width="2260" height="270" class="box red"/><text class="h" x="100" y="1180" fill="#102a43">Consumers, operations, and deployment</text>
<rect x="110" y="1215" width="500" height="145" class="box blue"/><text class="t" x="135" y="1255">React + Vite frontend</text><text class="s" x="135" y="1287">Dashboard, Trends, Financial, Research</text><text class="s" x="135" y="1315">Pipeline, Platforms, Settings</text>
<rect x="700" y="1215" width="430" height="145" class="box gray"/><text class="t" x="725" y="1255">Standalone CLI tools</text><text class="s" x="725" y="1287">cli_tools.py</text><text class="s" x="725" y="1315">JSON reports + realtime logs</text>
<rect x="1220" y="1215" width="430" height="145" class="box gray"/><text class="t" x="1245" y="1255">Observability</text><text class="s" x="1245" y="1287">Prometheus :9090</text><text class="s" x="1245" y="1315">Grafana :3000</text>
<rect x="1740" y="1215" width="500" height="145" class="box gray"/><text class="t" x="1765" y="1255">Terraform / production path</text><text class="s" x="1765" y="1287">ECS, S3, DynamoDB, Secrets Manager</text><text class="s" x="1765" y="1315">SQS DLQ, Airflow / MWAA</text>
<path class="line" d="M240 310 V400"/><path class="line" d="M540 310 V400"/><path class="line" d="M840 310 V400"/><path class="line" d="M1140 310 V400"/><path class="line" d="M1440 310 V400"/><path class="dash" d="M1740 310 V400"/>
