<path class="line" d="M500 930 H580"/><path class="line" d="M980 930 H1060"/><path class="line" d="M1460 930 H1540"/>
<path class="line" d="M1895 1035 V1130 H360 V1205"/><path class="dash" d="M1750 1035 V1130 H915 V1205"/><path class="dash" d="M2100 1035 V1205 H1435"/><path class="dash" d="M1995 660 V1130 H1990 V1205"/>
<text class="s" x="90" y="1460">Solid lines: primary runtime flow. Dashed lines: optional or operational paths. Local Compose mirrors core AWS services through LocalStack.</text>
