name: Deploy reports and ticket audit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate daily report JSON
        run: python3 scripts/daily-market-brief/validate_report_json.py
      - name: Build committed ticket audit
        run: python3 scripts/planning/build_ticket_audit.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload reports and templates
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
