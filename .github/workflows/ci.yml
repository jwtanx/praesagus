name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Validate daily market brief JSON
        run: python3 scripts/daily-market-brief/validate_report_json.py
      - name: Enforce publication eligibility for changed editions
        env:
          PUBLICATION_EVIDENCE_DIR: ${{ vars.PUBLICATION_EVIDENCE_DIR }}
        run: |
          python3 scripts/daily-market-brief/publication_gate.py --github-event \
            --publication-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --publication-evidence-dir "$PUBLICATION_EVIDENCE_DIR"
      - name: Install Poetry and dependencies
        run: |
          python -m pip install poetry
          poetry install --no-interaction --no-ansi --no-root
      - name: Install standalone research dependencies in the test interpreter
        run: |
          poetry run python -m pip install -r scripts/stock-research/requirements.txt "numpy>=1.26.4,<2"
          poetry run python -m pip check
          poetry run python -c "import numpy, pyarrow, pyarrow.parquet, pandas, sklearn, exchange_calendars, openpyxl; assert numpy.__version__.split('.')[0] == '1'"
      - name: Run tests
        env:
          PYTEST_ADDOPTS: --junitxml=/tmp/praesagus-pytest.xml
        run: poetry run python -m pytest -q
      - name: Summarize failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('/tmp/praesagus-pytest.xml')
          if not report.is_file():
              print('::warning title=pytest diagnostics::No JUnit report was produced; inspect the earlier failed step.')
          elif report.stat().st_size > 16 * 1024 * 1024:
              print('::warning title=pytest diagnostics::JUnit report exceeded the diagnostic size limit.')
          else:
              try:
                  cases = ET.parse(report)
              except ET.ParseError:
                  print('::warning title=pytest diagnostics::JUnit report was incomplete or malformed; inspect the original failed step.')
              else:
                  failures = [(case, result) for case in cases.iter('testcase')
                              for result in case if result.tag in ('failure', 'error')]
                  print(f'Failed pytest cases: {len(failures)}; showing at most 8 annotations.')
                  for case, result in failures[:8]:
                      message = (case.get('classname', '') + '.' + case.get('name', '')
                                 + ': ' + result.get('message', result.tag))[:1800]
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=pytest failure::' + message)
          PY
      - name: Replay ticket verification safety cases
        run: poetry run python -m pytest -q tests/test_ticket_verification.py
