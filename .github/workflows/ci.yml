name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Poetry and dependencies
        run: |
          pip install poetry
          poetry install --no-interaction --no-ansi --no-root
      - name: Run tests
        run: |
          test_log="$RUNNER_TEMP/pytest.log"
          if poetry run python -m pytest -q >"$test_log" 2>&1; then
            cat "$test_log"
          else
            cat "$test_log"
            error="$(tail -n 20 "$test_log")"
            error="${error//'%'/'%25'}"
            error="${error//$'\r'/'%0D'}"
            error="${error//$'\n'/'%0A'}"
            error="${error//':'/'%3A'}"
            error="${error//','/'%2C'}"
            echo "::error title=Pytest failed::$error"
            exit 1
          fi
