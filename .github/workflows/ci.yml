name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Validate daily market brief JSON
        run: python3 scripts/daily-market-brief/validate_report_json.py
      - name: Enforce publication eligibility for changed editions
        env:
          PUBLICATION_EVIDENCE_DIR: ${{ vars.PUBLICATION_EVIDENCE_DIR }}
        run: |
          python3 scripts/daily-market-brief/publication_gate.py --github-event \
            --publication-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --publication-evidence-dir "$PUBLICATION_EVIDENCE_DIR"
      - name: Install Poetry and dependencies
        run: |
          python -m pip install poetry
          poetry install --no-interaction --no-ansi --no-root
      - name: Install standalone research dependencies in the test interpreter
        run: |
          poetry run python -m pip install -r scripts/stock-research/requirements.txt "numpy>=1.26.4,<2"
          poetry run python -m pip check
          poetry run python -c "import numpy, pyarrow, pyarrow.parquet, pandas, sklearn, exchange_calendars, openpyxl; assert numpy.__version__.split('.')[0] == '1'"
      - name: Run tests
        run: poetry run python -m pytest -q
      - name: Replay ticket verification safety cases
        run: poetry run python -m pytest -q tests/test_ticket_verification.py
