name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Validate daily market brief JSON
        run: python3 scripts/daily-market-brief/validate_report_json.py
      - name: Enforce publication eligibility for changed editions
        env:
          PUBLICATION_EVIDENCE_DIR: ${{ vars.PUBLICATION_EVIDENCE_DIR }}
        run: |
          python3 scripts/daily-market-brief/publication_gate.py --github-event \
            --publication-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --publication-evidence-dir "$PUBLICATION_EVIDENCE_DIR"
      - name: Install Poetry and dependencies
        env:
          POETRY_VIRTUALENVS_OPTIONS_ALWAYS_COPY: "true"
        run: |
          python -m pip install poetry
          poetry install --no-interaction --no-ansi --no-root
      - name: Install standalone research dependencies in the test interpreter
        run: |
          poetry run python -m pip install -r scripts/stock-research/requirements.txt "numpy>=1.26.4,<2"
          poetry run python -m pip check
          poetry run python -c "import numpy, pyarrow, pyarrow.parquet, pandas, sklearn, exchange_calendars, openpyxl; assert numpy.__version__.split('.')[0] == '1'"
      - name: Prepare integrity-checked CI file permissions
        run: |
          poetry run python - <<'PY'
          from pathlib import Path
          import hashlib, os, stat, subprocess, sys
          root = Path.cwd().resolve()
          executable = Path(sys.executable).resolve()
          prefix = Path(sys.prefix).resolve()
          if prefix == Path(sys.base_prefix).resolve() or not executable.is_relative_to(prefix):
              print('::error title=CI integrity preparation::A copied Poetry virtualenv interpreter is required; shared toolcache Python is left untouched.')
              raise RuntimeError('CI interpreter is outside its virtualenv')
          sources = subprocess.check_output(['git', 'ls-files', '-z', '--', '*.py']).decode().split('\0')
          paths = [(executable, 'active Python executable')]
          for name in filter(None, sources):
              candidate = root / name
              if candidate.resolve() != candidate or not candidate.resolve().is_relative_to(root):
                  raise RuntimeError('Tracked Python source must be a regular file inside the checkout')
              paths.append((candidate, name))
          changes = []
          for path, label in paths:
              before = path.stat()
              if not stat.S_ISREG(before.st_mode):
                  raise RuntimeError('CI integrity preparation requires regular files')
              mode = stat.S_IMODE(before.st_mode)
              if mode & 0o022:
                  if before.st_uid != os.getuid():
                      print('::error title=CI integrity preparation::Writable file is not owned by the runner; refusing permission changes.')
                      raise PermissionError(label)
                  digest = hashlib.sha256(path.read_bytes()).digest()
                  path.chmod(mode & ~0o022)
                  after = path.stat()
                  if (stat.S_IMODE(after.st_mode) != (mode & ~0o022)
                          or after.st_uid != before.st_uid or after.st_gid != before.st_gid
                          or hashlib.sha256(path.read_bytes()).digest() != digest):
                      raise RuntimeError('CI permission preparation changed unexpected metadata or bytes')
                  changes.append((label, oct(mode), oct(stat.S_IMODE(after.st_mode))))
          print(f'::notice title=CI integrity preparation::{len(paths)} files checked; {len(changes)} writable modes tightened; byte identity preserved.')
          for label, old, new in changes[:8]:
              message = f'{label}: {old} to {new}'[:1800]
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=CI permission change::' + message)
          PY
      - name: Run tests
        env:
          PYTEST_ADDOPTS: --junitxml=/tmp/praesagus-pytest.xml
        run: poetry run python -m pytest -q
      - name: Summarize failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import xml.etree.ElementTree as ET
          report = Path('/tmp/praesagus-pytest.xml')
          if not report.is_file():
              print('::warning title=pytest diagnostics::No JUnit report was produced; inspect the earlier failed step.')
          elif report.stat().st_size > 16 * 1024 * 1024:
              print('::warning title=pytest diagnostics::JUnit report exceeded the diagnostic size limit.')
          else:
              try:
                  cases = ET.parse(report)
              except ET.ParseError:
                  print('::warning title=pytest diagnostics::JUnit report was incomplete or malformed; inspect the original failed step.')
              else:
                  failures = [(case, result) for case in cases.iter('testcase')
                              for result in case if result.tag in ('failure', 'error')]
                  groups = Counter(case.get('classname', 'unknown') for case, _ in failures)
                  summary = (f'{len(failures)} failures; groups: ' + ', '.join(f'{name}: {count}' for name, count in groups.most_common(8)))[:1800]
                  summary = summary.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::notice title=pytest failure summary::' + summary)
                  for case, result in failures[:8]:
                      message = (case.get('classname', '') + '.' + case.get('name', '')
                                 + ': ' + result.get('message', result.tag))[:1800]
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=pytest failure::' + message)
          PY
      - name: Replay ticket verification safety cases
        run: poetry run python -m pytest -q tests/test_ticket_verification.py
